name: Feature Request
description: Suggest a new feature or enhancement for the plugin
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
assignees: []

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues to make sure this feature hasn't been requested before
          required: true
        - label: I have checked the [documentation](https://github.com/maximseshuk/payload-plugin-openapi#readme) to confirm this feature doesn't already exist
          required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see, and what problem does it solve?
      placeholder: |
        - What problem does this solve?
        - How should it work?
    validations:
      required: true

  - type: textarea
    id: config-example
    attributes:
      label: Example Configuration (optional)
      description: If this involves config changes, show what you imagine it would look like
      placeholder: |
        ```typescript
        openapi({
          metadata: {
            title: 'My API',
            version: '1.0.0',
          },
          // Your proposed option here
        })
        ```
      render: typescript
